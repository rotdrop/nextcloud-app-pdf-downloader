name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NC_REPO: rotdrop/nextcloud-server
  NC_BRANCH: cjh-stable35
  APP_NAME: pdf_downloader

jobs:
  appstore:
    runs-on: ubuntu-latest
    env:
      PHP_VERSION: '8.5'
    steps:
      - name: Use https for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # The TypeScript type generation boots Nextcloud, so the app has to be
      # built inside a server tree.
      - name: Checkout modified Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NC_REPO }}
          ref: ${{ env.NC_BRANCH }}
          submodules: recursive
          path: server

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ env.APP_NAME }}
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, curl, dom, gd, iconv, intl, json, mbstring, openssl, pdo_sqlite, posix, sqlite3, xml, zip, apcu, bcmath, gmp, imagick, fileinfo
          tools: composer:v2
          ini-values: apc.enable_cli=1, memory_limit=1G

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Nextcloud (sqlite)
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php occ maintenance:install --database=sqlite \
            --admin-user=admin --admin-pass=admin --no-interaction

      - name: Install xpath
        # the Makefile needs xpath to read the app name and the scoped namespace from info.xml
        run: sudo apt-get install -y --no-install-recommends libxml-xpath-perl

      - name: Make appstore
        working-directory: server/apps/${{ env.APP_NAME }}
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: make appstore

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-appstore
          path: server/apps/${{ env.APP_NAME }}/build/artifacts/*.tar.gz
          if-no-files-found: warn
