# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Basic checks on pull requests and pushes to main via the shared CI
# workflow of the build system (eslint, php -l, realclean idempotency and a
# full build of the unsigned app archive). No Nextcloud server tree is
# needed: the TypeScript type generation only needs xpath and
# memory_limit=1G, both provided by the shared workflow.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: rotdrop/nextcloud-app-build-system/.github/workflows/ci.yml@v1
    with:
      php-version: '8.5'
      php-versions: '["8.4", "8.5"]'
      php-lint-dirs: lib appinfo templates composer
      # the font pipeline downloads the DejaVu fonts
      apt-packages: wget
